aid: lanzajet
name: LanzaJet
description: 'LanzaJet is a sustainable fuels technology company, headquartered at
  520 Lake Cook Road, Deerfield, Illinois, that produces and licenses sustainable aviation
  fuel (SAF) and renewable diesel. Founded in 2020 as a spin-out of LanzaTech with
  Suncor and Mitsui, and later backed by Shell, British Airways, Southwest Airlines,
  Microsoft''s Climate Innovation Fund, Breakthrough Energy, Groupe ADP, MUFG and All
  Nippon Airways, the company commercializes a patented Alcohol-to-Jet (ATJ) process
  that converts ethanol into synthetic paraffinic kerosene through a continuous catalytic
  reaction, reaching roughly 90% hydrocarbon selectivity to jet fuel and converting
  about 98% of the ethanol carbon into salable product. The ATJ pathway was approved
  by ASTM International in 2018. LanzaJet Freedom Pines Fuels in Soperton, Georgia
  — opened in 2024 — is the world''s first commercial ethanol-to-jet SAF plant, producing
  roughly 10 million gallons of SAF and renewable diesel a year, and the company is
  developing Project Speedbird in the UK alongside a CirculAir joint solution with
  LanzaTech that widens the feedstock base to municipal solid waste, agricultural residues
  and industrial off-gases via gas fermentation. LanzaJet sells technology licenses,
  project development and engineering services and fuel offtake rather than software:
  as of this profiling pass it publishes no public developer portal, no API reference,
  no SDKs, and no machine-readable API contract of any kind, and every /.well-known/
  discovery probe against its web host returned 404.'
